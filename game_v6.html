    <script>
    // ============ LOG PANEL LOGIC ============
    window.__logs = [];
    window.__logCount = 0;
    
    window.addLog = function(msg, type) {
        type = type || 'log';
        window.__logCount++;
        window.__logs.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
        
        var list = document.getElementById('error-list');
        if (list) {
            var div = document.createElement('div');
            div.className = type === 'error' ? 'err-item' : (type === 'warn' ? 'warn-item' : 'log-item');
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }
        
        var cnt = document.getElementById('err-count');
        if (cnt) cnt.textContent = window.__logCount;
        
        var toggle = document.getElementById('toggle-error-panel');
        if (toggle) toggle.textContent = '📋 ' + window.__logCount;
    };
    
    window.copyErrors = function() {
        var text = window.__logs.join('\n');
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() { alert('✅ Copied ' + window.__logs.length + ' lines'); });
        } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('✅ Copied ' + window.__logs.length + ' lines');
        }
    };
    
    window.clearErrors = function() {
        document.getElementById('error-list').innerHTML = '';
        window.__logs = [];
        window.__logCount = 0;
        document.getElementById('err-count').textContent = '0';
    };
    
    window.toggleErrorPanel = function(show) {
        var panel = document.getElementById('error-panel');
        var toggle = document.getElementById('toggle-error-panel');
        if (show) { panel.style.display = 'block'; toggle.style.display = 'none'; }
        else { panel.style.display = 'none'; toggle.style.display = 'block'; }
    };
    
    // Override console.log/error
    var _origLog = console.log;
    var _origError = console.error;
    var _origWarn = console.warn;
    console.log = function() {
        var msg = Array.prototype.slice.call(arguments).map(function(a) {
            if (typeof a === 'object') { try { return JSON.stringify(a).substring(0, 300); } catch(e) { return String(a); } }
            return String(a);
        }).join(' ');
        window.addLog(msg, 'log');
        _origLog.apply(console, arguments);
    };
    console.error = function() {
        var msg = Array.prototype.slice.call(arguments).join(' ');
        window.addLog('❌ ' + msg, 'error');
        _origError.apply(console, arguments);
    };
    console.warn = function() {
        var msg = Array.prototype.slice.call(arguments).join(' ');
        window.addLog('⚠️ ' + msg, 'warn');
        _origWarn.apply(console, arguments);
    };
    
    window.onerror = function(msg, url, line) {
        window.addLog('❌ ERROR L' + line + ': ' + msg, 'error');
        return true;
    };
    
    // ============ CONSOLE PANEL LOGIC ============
    window.__consoleBuffer = [];
    
    window.runConsoleInput = function() {
        var input = document.getElementById('console-input');
        var code = input.value.trim();
        if (!code) return;
        
        window.consoleOutput('>>> ' + code);
        input.value = '';
        
        try {
            var result = eval(code);
            if (result !== undefined) {
                var str = typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result);
                window.consoleOutput('<<< ' + str);
            }
        } catch(e) {
            window.consoleOutput('❌ Lỗi: ' + e.message);
        }
    };
    
    window.consoleOutput = function(msg) {
        window.__consoleBuffer.push(msg);
        var out = document.getElementById('console-output');
        if (out) {
            var div = document.createElement('div');
            div.textContent = msg;
            out.appendChild(div);
            out.scrollTop = out.scrollHeight;
        }
    };
    
    window.copyConsoleOutput = function() {
        var text = window.__consoleBuffer.join('\n');
        if (!text) { alert('Không có output'); return; }
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() { alert('✅ Copied ' + window.__consoleBuffer.length + ' lines'); });
        }
    };
    
    window.clearConsoleOutput = function() {
        document.getElementById('console-output').innerHTML = '';
        window.__consoleBuffer = [];
    };
    
    window.toggleConsolePanel = function(show) {
        var panel = document.getElementById('console-panel');
        var toggle = document.getElementById('toggle-console-panel');
        if (show) { panel.style.display = 'block'; toggle.style.display = 'none'; }
        else { panel.style.display = 'none'; toggle.style.display = 'block'; }
    };
    
    console.log('✅ Console + Log panels ready');
    </script>

        lapThap: async function() {
            var selected = document.getElementById('cp-selected-tower').value.trim();
            var bou = document.getElementById('cp-bou-tower').value.trim();
            if (!selected) { this.log("⚠️ SELECTED_TOWER rỗng"); return; }

            this.log("🔨 LẮP ⏳ Gửi lên server2...");
            try {
                var res = await fetch("/api/lap-thap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        UNIQ_ID: window.__userData && window.__userData.VALUE.normal.value.UNIQ_ID,
                        HOST_ID: window.__userData && window.__userData.VALUE.normal.value.HOST_ID,
                        SELECTED_TOWER: selected,
                        BOU_TOWER: bou,

                var data = await res.json();

                await this.loadAll();
            } catch(e) { this.log("❌ " + e.message); }

        thaoThap: async function() {
            var selected = document.getElementById('cp-selected-tower').value.trim();
            var bou = document.getElementById('cp-bou-tower').value.trim();
            if (!selected) { this.log("⚠️ SELECTED_TOWER rỗng"); return; }

            var ids = selected.split(",").map(function(s) { return s.trim(); }).filter(Boolean);
            var input = prompt(
                "Nhập ID muốn THÁO (cách nhau dấu phẩy)\n" +
                "Để TRỐNG = tháo TẤT CẢ\n\n" +
                "Đang có: " + ids.join(", "),
                ""
            );
            if (input === null) return;

            var toRemove = input.split(",").map(function(s) { return s.trim(); }).filter(Boolean);
            var removeAll = (toRemove.length === 0);

            this.log("💥 THÁO ⏳ Gửi lên server2...");
            this.log("   → Tháo: " + (removeAll ? "TẤT CẢ" : toRemove.join(",")));

            try {

                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        UNIQ_ID: window.__userData && window.__userData.VALUE.normal.value.UNIQ_ID,
                        HOST_ID: window.__userData && window.__userData.VALUE.normal.value.HOST_ID,
                        SELECTED_TOWER: selected,
                        BOU_TOWER: bou,

                        REMOVE_ALL: removeAll,
                        COMMENT: removeAll ? "Tháo TẤT CẢ" : ("Tháo: " + toRemove.join(","))

                });
                var data = await res.json();
                if (data.ok) {

                } else {
                    this.log("❌ THÁO LỖI: " + (data.error || "unknown") + "\n" + (data.stderr || ""));
                }
                await this.loadAll();
            } catch(e) { this.log("❌ " + e.message); }
        },

                var data = await res.json();
                if (data.ok) {
                    this.log("✅ HERO THÀNH CÔNG!\n\n📤 Payload:\n" + JSON.stringify(data.payload, null, 2) + "\n\n📥 Kết quả từ node -e:\n" + (data.output || "(không có)"));
                } else {
                    this.log("❌ HERO LỖI: " + (data.error || "unknown") + "\n" + (data.stderr || ""));
                }
                await this.loadAll();
            } catch(e) { this.log("❌ " + e.message); }
        }
    };
    console.log('🎮 CP ready');
    </script>
